[package]
name = "fidoparole"
version = "0.1.0"
description = "FidoParole — a password vault stored on a FIDO2 security key (hmac-secret encryption, largeBlob storage)"
authors = ["Token2"]
edition = "2021"

[[bin]]
name = "fidoparole"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[build-dependencies]
tauri-build = "2"

[dependencies]
aes-gcm = "0.11.1"
arboard = "3.6.1"
argon2 = "0.6.0"
flate2 = "1.1.10"
hex = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.190"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tauri = "2"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["serde", "derive"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
